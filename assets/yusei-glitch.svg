<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 450 192" width="450" height="192" role="img" aria-label="YUSEI">
<title>YUSEI</title>
<style>
.main  { color: #e6edf3; animation: jitter 4s infinite steps(1); }
.red   { color: #ff2e63; mix-blend-mode: screen; animation: shift-r 4s infinite steps(1); }
.cyan  { color: #08f7fe; mix-blend-mode: screen; animation: shift-c 4s infinite steps(1); }
.slice { color: #e6edf3; opacity: 0; }
.s1 { animation: slice1 4s infinite steps(1); }
.s2 { animation: slice2 4s infinite steps(1); }
.screen { animation: flicker 4s infinite steps(1); }

@keyframes jitter {
  0%, 100% { transform: translate(0, 0); }
  12% { transform: translate(-2px, 1px); }
  14% { transform: translate(3px, -1px); }
  16% { transform: translate(0, 0); }
  62% { transform: translate(2px, 0); }
  64% { transform: translate(0, 0); }
}
@keyframes shift-r {
  0%, 100% { transform: translate(-1px, 0); }
  11% { transform: translate(-7px, 1px); }
  14% { transform: translate(5px, -2px); }
  17% { transform: translate(-1px, 0); }
  61% { transform: translate(-6px, 0); }
  64% { transform: translate(-1px, 0); }
}
@keyframes shift-c {
  0%, 100% { transform: translate(1px, 0); }
  11% { transform: translate(6px, -1px); }
  14% { transform: translate(-5px, 2px); }
  17% { transform: translate(1px, 0); }
  61% { transform: translate(6px, 0); }
  64% { transform: translate(1px, 0); }
}
@keyframes slice1 {
  0%, 100% { opacity: 0; }
  11% { opacity: 1; clip-path: inset(18% 0 62% 0); transform: translate(-14px, 0); }
  13% { opacity: 1; clip-path: inset(55% 0 30% 0); transform: translate(10px, 0); }
  15% { opacity: 0; }
  61% { opacity: 1; clip-path: inset(40% 0 45% 0); transform: translate(12px, 0); }
  63% { opacity: 0; }
}
@keyframes slice2 {
  0%, 100% { opacity: 0; }
  12% { opacity: 1; clip-path: inset(68% 0 14% 0); transform: translate(9px, 0); }
  14% { opacity: 1; clip-path: inset(30% 0 58% 0); transform: translate(-11px, 0); }
  16% { opacity: 0; }
  62% { opacity: 1; clip-path: inset(62% 0 22% 0); transform: translate(-8px, 0); }
  64% { opacity: 0; }
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  13% { opacity: 0.8; }
  14% { opacity: 1; }
  62% { opacity: 0.85; }
  63% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
